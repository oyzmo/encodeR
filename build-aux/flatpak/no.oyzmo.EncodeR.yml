# Flatpak manifest for encodeR. Built by `scripts/install.sh --make-flatpak`.
# Bundles its own ffmpeg (VA-API + libvmaf) and dovi_tool; the VA-API driver
# comes from the runtime's GL extension. mkvpropedit is not included (the MKV
# HDR repair is unavailable; HEVC and AV1 keep HDR10 metadata on their own).
id: no.oyzmo.EncodeR
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: encoder
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # VA-API encoding on the GPU.
  - --device=dri
  # Read sources and write outputs next to them, including NAS mounts.
  - --filesystem=host
modules:
  # Build-only helper: libvmaf embeds its models with xxd, which the SDK lacks.
  - name: xxd
    buildsystem: simple
    build-commands:
      - cc -O2 -o xxd xxd.c
      - install -Dm755 xxd /app/bin/xxd
    cleanup:
      - '*'
    sources:
      - type: file
        url: https://raw.githubusercontent.com/vim/vim/v9.1.0000/src/xxd/xxd.c
        sha256: 081c52b38668bb1f68afbb9fef4d73eec88fc12f6ac0f8bef5abf4332d8a61d0

  - name: libvmaf
    buildsystem: meson
    subdir: libvmaf
    config-opts:
      - -Denable_tests=false
      - -Denable_docs=false
      - -Dbuilt_in_models=true
    cleanup:
      - /bin
      - /include
      - /lib/pkgconfig
      - '*.a'
    sources:
      - type: archive
        url: https://github.com/Netflix/vmaf/archive/refs/tags/v3.0.0.tar.gz
        sha256: 7178c4833639e6b989ecae73131d02f70735fdb3fc2c7d84bc36c9c3461d93b1

  - name: ffmpeg
    config-opts:
      # cropdetect (black-bar detection) is a GPL filter.
      - --enable-gpl
      - --disable-static
      - --enable-shared
      - --disable-doc
      - --disable-debug
      - --disable-ffplay
      - --enable-vaapi
      - --enable-libdrm
      - --enable-libvmaf
      - --enable-libdav1d
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/ffmpeg/examples
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-8.1.3.tar.xz
        sha256: 7138d28c96d9d3e3af4ee3d8cad72741f8ffb40da90c1112235dea3ecd3178a3

  # Dolby Vision RPU extraction/injection for the experimental DV path.
  - name: dovi_tool
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/dovi_tool/cargo
      build-args:
        - --share=network
    build-commands:
      # The bundled font avoids needing fontconfig for its plot command.
      - cargo build --release --locked --no-default-features --features internal-font
      - install -Dm755 target/release/dovi_tool /app/bin/dovi_tool
    sources:
      - type: archive
        url: https://github.com/quietvoid/dovi_tool/archive/refs/tags/2.3.4.tar.gz
        sha256: 15b5cb68b3598e51ca968316443c9fb9597b6230e9d692cb4e641d54505a97ec

  - name: encoder
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/encoder/cargo
      # Local builds fetch crates from crates.io (Cargo.lock pins the versions).
      build-args:
        - --share=network
    build-commands:
      - cargo build --release --locked
      - install -Dm755 target/release/encoder /app/bin/encoder
      - install -Dm644 data/no.oyzmo.EncodeR.desktop /app/share/applications/no.oyzmo.EncodeR.desktop
      - install -Dm644 data/icons/hicolor/scalable/apps/no.oyzmo.EncodeR.svg /app/share/icons/hicolor/scalable/apps/no.oyzmo.EncodeR.svg
    sources:
      - type: dir
        path: ../..
        skip:
          - target
          - dev
          - flatpak
          - .flatpak-builder
          - testvideo
