[package]
name = "encoder"
version = "0.3.9"
edition = "2024"
description = "Shrink large videos with VA-API hardware encoding"
license = "GPL-3.0-or-later"

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_9"] }
gtk = { package = "gtk4", version = "0.11", features = ["gnome_50"] }
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "2"

[profile.release]
lto = "thin"
